plugins {
    id "com.android.application"
}

def defaultPaperbriqApiBaseUrl = "https://paperbriq.onrender.com"
def paperbriqApiBaseUrl = System.getenv("PAPERBRIQ_API_BASE_URL") ?: (project.findProperty("PAPERBRIQ_API_BASE_URL") ?: defaultPaperbriqApiBaseUrl)
def escapedPaperbriqApiBaseUrl = paperbriqApiBaseUrl
    .replace("\\", "\\\\")
    .replace("\"", "\\\"")

android {
    namespace "com.paperbriq.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.paperbriq.app"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2"
        buildConfigField "String", "PAPERBRIQ_API_BASE_URL", "\"${escapedPaperbriqApiBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
    implementation "com.google.zxing:core:3.5.3"
}
